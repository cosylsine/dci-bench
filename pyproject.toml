[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dci-bench"
version = "0.1.0"
description = "Minimal DCI-Bench MVP harness contracts, data builder, and retrieval scoring."
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.18",
  "pyarrow>=12",
]

[project.optional-dependencies]
test = [
  "pytest>=7",
]

[tool.setuptools.packages.find]
include = ["dci_bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
