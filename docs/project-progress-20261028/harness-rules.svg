<svg class="harness-rules-svg" xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="frozen-rules-title frozen-rules-desc">
  <title id="frozen-rules-title">Document Pool v2 一题 Harness 执行与 Frozen 隔离规则</title>
  <desc id="frozen-rules-desc">一题从固定候选池开始，使用相同 query、Prompt 和累计预算。每次输入、输出和工具返回都受限并记账；搜索和显式 read 产生正文证据。Bash 经过 Bubblewrap 访问当前 Query 的只读 corpus 和独立 scratch。收尾后只提交一次，最多修复一次，最后由 Host 校验、评分并检查 Runtime Identity。图中同步于 2026-11-13，实施证据来自 2026-11-11。</desc>
  <defs>
    <marker id="frozen-rules-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L9 5 L0 10" fill="none" stroke="#688277" stroke-width="1.8"/>
    </marker>
    <style>
      .harness-rules-svg text{font-family:'Noto Sans CJK SC','WenQuanYi Zen Hei','Microsoft YaHei',sans-serif;fill:#193b36}
      .harness-rules-svg .eyebrow{font-size:16px;letter-spacing:2px;fill:#58786e}.harness-rules-svg .title{font-size:36px;font-weight:700}.harness-rules-svg .sub{font-size:19px;fill:#526c65}
      .harness-rules-svg .section{font-size:19px;font-weight:700;fill:#176b56}.harness-rules-svg .head{font-size:25px;font-weight:700}.harness-rules-svg .label{font-size:20px;font-weight:700}.harness-rules-svg .body{font-size:18px;fill:#46635b}.harness-rules-svg .small{font-size:16px;fill:#526c65}.harness-rules-svg .mono{font-family:monospace;font-size:17px;fill:#193b36}.harness-rules-svg .strong{font-weight:700}
      .harness-rules-svg .card{fill:#fff;stroke:#cddad1;stroke-width:1.5}.harness-rules-svg .soft{fill:#eaf3ed;stroke:#c5d9cc;stroke-width:1.5}.harness-rules-svg .chip{fill:#f0f5ed;stroke:#cddad1;stroke-width:1.2}.harness-rules-svg .dark{fill:#176b56;stroke:#176b56;stroke-width:1.5}.harness-rules-svg .darktext{fill:#fff}.harness-rules-svg .warn{fill:#fbf3e4;stroke:#e5d5b9;stroke-width:1.3}.harness-rules-svg .identity{fill:#edf2e9;stroke:#cddad1;stroke-width:1.5}.harness-rules-svg .edge{fill:none;stroke:#688277;stroke-width:2;marker-end:url(#frozen-rules-arrow)}
    </style>
  </defs>

  <rect width="1600" height="1600" rx="24" fill="#f7f8f2"/>
  <text x="56" y="42" class="eyebrow">DCI-BENCH / DOCUMENT TRACK / ONE-QUESTION HARNESS</text>
  <text x="56" y="84" class="title">一题执行：Document Pool v2 Harness 规则</text>
  <text x="56" y="112" class="sub">固定范围、共享预算、可信 read 证据、Frozen Bash 隔离、Host 侧验收</text>

  <g data-box="56 132 1488 82">
    <rect x="56" y="132" width="1488" height="82" rx="12" class="soft"/>
    <text x="80" y="160" class="label" fill="#176b56">v2 一题合同</text>
    <text x="250" y="160" class="body">Lite 200  ⊂  Full 1,000　·　同一 query / Prompt / 累计预算 64,000 token　·　sample timeout = null</text>
    <text x="80" y="190" class="small">context ≤ 65,536　·　输出 ≤ 1,024　·　工具返回 ≤ 8 KiB　·　每次 Bash 默认 10 秒 / 上限 60 秒；其余资源限制继续生效</text>
  </g>

  <path d="M84 250 V268" class="edge"/>
  <path d="M84 448 V466" class="edge"/>
  <path d="M84 688 V706" class="edge"/>
  <path d="M84 972 V990" class="edge"/>
  <path d="M84 1240 V1258" class="edge"/>

  <circle cx="84" cy="300" r="25" fill="#176b56"/><text x="76" y="310" class="head darktext">1</text>
  <g data-box="120 268 1424 180">
    <rect x="120" y="268" width="1424" height="180" rx="14" class="card"/>
    <text x="152" y="307" class="head">进入一题：先固定候选范围</text>
    <text x="152" y="345" class="body">Lite 提供 200 篇，Full 提供 1,000 篇；Lite 200  ⊂  Full 1,000。</text>
    <text x="152" y="378" class="body">两个层级使用同一 query、同一 Prompt、同一累计预算，只改变候选集合。</text>
    <rect x="152" y="397" width="1330" height="30" rx="7" class="chip"/>
    <text x="170" y="418" class="small">Host 按候选 ID 物化本题 corpus；qrels、正例标签、历史映射和评分结果留在 Host。</text>
  </g>

  <circle cx="84" cy="498" r="25" fill="#176b56"/><text x="76" y="508" class="head darktext">2</text>
  <g data-box="120 466 1424 222">
    <rect x="120" y="466" width="1424" height="222" rx="14" class="card"/>
    <text x="152" y="505" class="head">一题一份总账：每轮实际用量都记入</text>
    <text x="152" y="541" class="body">每次实际模型输入与输出累加；工具返回在后续作为输入发送时计费。</text>
    <text x="152" y="566" class="small">历史消息再次发送，也再次计入同一题预算。</text>
    <g data-box="152 582 300 72"><rect x="152" y="582" width="300" height="72" rx="10" class="soft"/><text x="172" y="611" class="label">累计上限</text><text x="172" y="638" class="body strong">64,000 token</text></g>
    <g data-box="476 582 300 72"><rect x="476" y="582" width="300" height="72" rx="10" class="chip"/><text x="496" y="611" class="label">单次 context</text><text x="496" y="638" class="body strong">≤ 65,536</text></g>
    <g data-box="800 582 300 72"><rect x="800" y="582" width="300" height="72" rx="10" class="chip"/><text x="820" y="611" class="label">模型输出</text><text x="820" y="638" class="body strong">≤ 1,024</text></g>
    <g data-box="1124 582 358 72"><rect x="1124" y="582" width="358" height="72" rx="10" class="chip"/><text x="1144" y="611" class="label">工具返回</text><text x="1144" y="638" class="body strong">≤ 8 KiB</text></g>
    <text x="152" y="680" class="small">最多 12 个 search round、24 次 tool call；达到预算或边界后进入收尾。sample 没有协议级时间上限。</text>
  </g>

  <circle cx="84" cy="736" r="25" fill="#176b56"/><text x="76" y="746" class="head darktext">3</text>
  <g data-box="120 706 1424 266">
    <rect x="120" y="706" width="1424" height="266" rx="14" class="soft"/>
    <text x="152" y="745" class="head">搜索 ↔ read：正文证据与 Frozen Bash 同时受控</text>
    <g data-box="152 770 652 174">
      <rect x="152" y="770" width="652" height="174" rx="11" class="card"/>
      <text x="176" y="804" class="label">模型工具循环</text>
      <text x="176" y="836" class="body">自主选择 Bash / read，无固定检索顺序</text>
      <text x="176" y="868" class="body">显式 read 返回非空正文，才产生 read receipt</text>
      <text x="176" y="900" class="small">Bash 直接 cat / rg 仍不计为 read receipt；不要求每个 ID 都被 read</text>
      <text x="176" y="928" class="small">工具协议、read 校验和 receipt 由 Host / Pi 管理</text>
    </g>
    <g data-box="836 770 646 174">
      <rect x="836" y="770" width="646" height="174" rx="11" class="dark"/>
      <text x="860" y="804" class="label darktext">每次 Bash → Bubblewrap</text>
      <text x="860" y="836" class="body darktext">当前 Query corpus [RO]　·　独立 scratch [RW]</text>
      <text x="860" y="868" class="body darktext">/tmp → scratch/tmp，同一计费空间</text>
      <text x="860" y="900" class="body darktext">无网络、Host /usr、qrels、/proc、GPU、凭据</text>
      <text x="860" y="928" class="small darktext">Bash 工具来自共享只读 Frozen RootFS；Query 间不共享 scratch</text>
    </g>
  </g>

  <circle cx="84" cy="1020" r="25" fill="#176b56"/><text x="76" y="1030" class="head darktext">4</text>
  <g data-box="120 990 1424 250">
    <rect x="120" y="990" width="1424" height="250" rx="14" class="card"/>
    <text x="152" y="1029" class="head">收尾、提交与一次修复机会</text>
    <text x="152" y="1064" class="body">完成判断，或达到预算 / search round / tool call 边界后，关闭搜索与读取工具并整理已有内容。</text>
    <g data-box="152 1090 390 112"><rect x="152" y="1090" width="390" height="112" rx="10" class="chip"/><text x="176" y="1124" class="label">1 次提交</text><text x="176" y="1156" class="body">唯一、非空、语料内的</text><text x="176" y="1184" class="body">ranked_doc_ids</text></g>
    <g data-box="574 1090 390 112"><rect x="574" y="1090" width="390" height="112" rx="10" class="soft"/><text x="598" y="1124" class="label">最多 1 次修复</text><text x="598" y="1156" class="body">只修格式或 ID</text><text x="598" y="1184" class="body">继续扣同一预算</text></g>
    <g data-box="996 1090 486 112"><rect x="996" y="1090" width="486" height="112" rx="10" class="warn"/><text x="1020" y="1124" class="label">无非空 read receipt → 失败</text><text x="1020" y="1156" class="body">final 修复不能补读或重开工具</text><text x="1020" y="1184" class="small">修复只处理格式 / ID；失败即终止</text></g>
  </g>

  <circle cx="84" cy="1288" r="25" fill="#176b56"/><text x="76" y="1298" class="head darktext">5</text>
  <g data-box="120 1258 1424 222">
    <rect x="120" y="1258" width="1424" height="222" rx="14" class="identity"/>
    <text x="152" y="1297" class="head">Host 验收、评分与身份封存</text>
    <text x="152" y="1334" class="body">Host 检查 JSON、ID、非空 read receipt，再用隐藏 qrels 评分；结果保存排名、轨迹和成本。</text>
    <text x="152" y="1368" class="body">result / trace / manifest 必须携带同一 agent_runtime；父子进程、批次和 summary 逐层核对。</text>
    <rect x="152" y="1392" width="1330" height="58" rx="9" class="warn"/>
    <text x="176" y="1418" class="label">跨 Runtime 或身份不匹配 → 拒绝 resume、completed reuse、calibration；旧记录不补写。</text>
    <text x="176" y="1441" class="small">格式通过不等于检索正确；模型质量与正式排名仍需真实候选数据和真实模型阶段另行验收。</text>
  </g>

  <g data-box="56 1510 1488 64">
    <rect x="56" y="1510" width="1488" height="64" rx="11" fill="#fff" stroke="#cddad1"/>
    <text x="78" y="1536" class="small">同步 2026-11-13 · 实施证据 2026-11-11 · 105 Python / 31 Pi / 15 synthetic bridge 仅是开发验收，不是正式模型成绩</text>
    <text x="78" y="1560" class="small">Frozen 需显式启用；Host Tools 默认保留，Code Track 不切换。P6、真实模型 smoke、等预算 Host↔Frozen 消融待验收。</text>
  </g>
</svg>
